 tab:function(id){tab(id)},back:pop,close:closeSheet,settings:sSettings,filter:sFilter,plus:sPlus,

 tseg:function(id){S.teamSeg=id;render()},kseg:function(id){S.kSeg=id;render()},rank:function(id){S.rank=id;render()},

  var old=pById(id)||{};savePlayerData({id:id||"",name:nm,number:nr===""?null:Number(nr),pos:$("#p-pos").value,active:$("#p-a").checked,birth:$("#p-b").value?Number($("#p-b").value):null,nation:$("#p-na").value.trim(),photo:old.photo||""}).then(function(){closeSheet();render();snack("Gesichert")},function(e){$("#p-e").textContent=e.message;b.disabled=false})},
 delplayer:function(id){var used=S.games.some(function(g){return g.lineup.some(function(l){return l.pid===id})||g.goals.some(function(x){return x.team==="E"&&(x.scorer===id||x.a1===id||x.a2===id)})||g.pens.some(function(x){return x.team==="E"&&x.pid===id})});
  if(used){$("#p-e").textContent="Dieser Spieler steht in Spielberichten. Statt zu löschen: Haken bei „Aktiv“ entfernen, dann bleibt die Statistik erhalten.";return}
  var b=$("[data-act=delplayer]");if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Wirklich löschen?";return}
  call("deletePlayer",id).then(function(){S.players=S.players.filter(function(p){return p.id!==id});cacheNow();closeSheet();S.stk.team=[{t:"team"}];render();snack("Spieler gelöscht")},function(e){$("#p-e").textContent=e.message})},

 disconnect:function(){var b=$("[data-act=disconnect]");if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Wirklich trennen?";return}LS.set("gl.api",null);LS.set("gl.cache",null);window.GL_API=null;closeSheet();S.ready=false;render()},

 connect:function(){var url=$("#su-url").value.trim(),key=$("#su-key").value.trim(),err=$("#su-err");err.textContent="";
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){err.textContent="Die Adresse muss mit https://script.google.com beginnen und auf /exec enden.";return}
  if(!key){err.textContent="Bitte den Schlüssel eintragen.";return}
  var b=$("[data-act=connect]");b.disabled=true;b.textContent="Prüfe …";window.GL_API={url:url,key:key};
  call("ping").then(function(r){S.apiV=r&&r.version;LS.set("gl.api",window.GL_API);S.ready=false;render();loadAll()},function(e){window.GL_API=null;err.textContent=e.auth?"Der Schlüssel wird nicht akzeptiert.":e.message;b.disabled=false;b.textContent="Verbinden"})}
};
